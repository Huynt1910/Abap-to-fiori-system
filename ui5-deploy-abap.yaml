# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
specVersion: "4.0"
metadata:
  name: abap-to-fiori-system
type: application

builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertErrors: false
        target:
          url: env:UI5_MIDDLEWARE_SIMPLE_PROXY_BASEURI
          client: "324"
          auth: basic
        credentials:
          username: env:UI5_MIDDLEWARE_SIMPLE_PROXY_USERNAME
          password: env:UI5_MIDDLEWARE_SIMPLE_PROXY_PASSWORD
        app:
          name: ZMIGANALYSIS
          description: ABAP to Fiori Modernization Cockpit
          package: REPLACE_WITH_ABAP_PACKAGE
          transport: REPLACE_WITH_TRANSPORT
        exclude:
          - "/test/"
          - "/localService/"
