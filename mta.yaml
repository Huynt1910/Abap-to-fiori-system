_schema-version: "3.2"
ID: abap-to-fiori-system
version: 1.0.0
description: ABAP to Fiori Modernization Cockpit

modules:
  - name: abap-to-fiori-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      disk-quota: 256M
      memory: 256M
      routes:
        - route: ${org}-${space}-abap-to-fiori.${default-domain}
    requires:
      - name: abap-to-fiori-html5-runtime
      - name: abap-to-fiori-destination
      - name: abap-to-fiori-xsuaa

  - name: abap-to-fiori-content
    type: com.sap.application.content
    path: .
    requires:
      - name: abap-to-fiori-html5-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: abap-to-fiori-ui
          artifacts:
            - abap-to-fiori-system.zip
          target-path: resources/

  - name: abap-to-fiori-ui
    type: html5
    path: .
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build:cf
      build-result: dist
      supported-platforms: []

resources:
  - name: abap-to-fiori-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: abap-to-fiori-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: abap-to-fiori-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Name: ui5
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                URL: https://ui5.sap.com
            existing_destinations_policy: update

  - name: abap-to-fiori-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
