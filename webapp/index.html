<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ABAP to Fiori Modernization Cockpit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script
      id="sap-ui-bootstrap"
      src="resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-libs="sap.m,sap.f,sap.ui.layout"
      data-sap-ui-resourceroots='{"abap.to.fiori.system": "./"}'
      data-sap-ui-compatversion="edge"
      data-sap-ui-async="true"
      data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
    ></script>
  </head>

  <body class="sapUiBody sapUiSizeCompact">
    <div
      data-sap-ui-component
      data-name="abap.to.fiori.system"
      data-id="container"
      data-settings='{"id":"abap-to-fiori-system"}'
    ></div>
  </body>
</html>
