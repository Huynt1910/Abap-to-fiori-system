<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ABAP to Fiori Modernization Cockpit</title>

    <script
      id="sap-ui-bootstrap"
      src="resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-libs="sap.m,sap.f,sap.ui.layout"
      data-sap-ui-resourceroots='{"abap.to.fiori.system": "./"}'
      data-sap-ui-compat-version="edge"
      data-sap-ui-async="true"
    ></script>

    <script>
      sap.ui.getCore().attachInit(function () {
        sap.ui.require(
          ["sap/ui/core/Component", "sap/ui/core/ComponentContainer"],
          function (Component, ComponentContainer) {
            Component.create({
              name: "abap.to.fiori.system",
              id: "abap-to-fiori-system",
              manifest: true,
            }).then(function (oComp) {
              new ComponentContainer({
                component: oComp,
                height: "100%",
                width: "100%",
              }).placeAt("container");
            });
          },
        );
      });
    </script>
  </head>

  <body class="sapUiBody sapUiSizeCompact">
    <div id="container" style="height: 100%"></div>
  </body>
</html>
